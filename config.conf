# notifier configuration
# Window / layout
[general]
width = 360
margin = 20
radius = 0
# radius = 0  # rectangular cards (required for clean kitty-style blur)
# padding_h = horizontal space between card edge and text
padding_h = 16
# padding_v = vertical space between card edge and content (inside the card)
padding_v = 8
# card_spacing = vertical gap between stacked notifications
card_spacing = 18
font_family = Cantarell
font_size = 10.5
timeout_low = 10000
timeout_normal = 5000
timeout_critical = 15000
timer_default = 10000
top = 68
# background_opacity = 1.0  # kitty-style: 1.0 opaque, 0.0 fully transparent

# App-side blur (compositor-independent, on by default): symm grabs the
# desktop pixels behind each card and gaussian-blurs them itself, so it looks
# frosted on any compositor -- no Hyprland layer-rules needed. Where the
# compositor refuses screen capture (common on stricter Wayland setups) it
# falls back to a synthesized frosted-glass panel instead of going blank.
blur_enabled = true
blur_radius = 24
# Pair with background_opacity < 1 so the blur shows through the tint.
#
# Alternative: disable blur_enabled above and instead let Hyprland blur the
# layer-surface itself (each card is its own surface, scope 'notifier'):
#   layerrule = blur, notifier
#   layerrule = ignorealpha 0.4, notifier

# Icons: rendered from the sending app's icon (themed name, path, or raw
# pixel data), shown to the left of the text.
icons_enabled = true
icon_size = 40

# Details: bodies longer than this many characters are shown truncated with
# "..."; click the card once to expand and read the full text (this pauses
# its auto-dismiss timer). A second click dismisses it.
body_truncate_chars = 180

# Use active monitor (Hyprland only, via hyprctl): place each new
# notification on whichever monitor is focused at the moment it's sent. It
# does not move an already-shown notification if focus later changes.
use_active_monitor = true

bar_move_right = false
bar_reverse = false
# true: 100% -> 0%; false: 0% -> 100%
bar_fill = true

# Base colors
[colors]
background = #1e1e2e
foreground = #cdd6f4
dim_foreground = #a6adc8

# Urgency accent colors (bar = timer bar, accent = card border)
[urgent_low]
bar = #6c7086
accent = #6c7086

[urgent_normal]
bar = #89b4fa
accent = #89b4fa

[urgent_warning]
bar = #f9e2af
accent = #f9e2af

[urgent_error]
bar = #f38ba8
accent = #f38ba8

[urgent_critical]
bar = #f38ba8
accent = #fb4934
