# symm configuration

[general]
width = 360
margin = 20
top = 68
radius = 0
padding_h = 16
padding_v = 8
gap = 6
card_spacing = 18
font_family = Cantarell
font_size = 10.5

# Timeouts (ms). Persistent notifications stay until clicked and show a bar
# draining over timer_default.
timeout_low = 10000
timeout_normal = 5000
timeout_critical = 15000
timer_default = 10000
persist_on_minus_one = true

blur_enabled = true
blur_radius = 24
use_active_monitor = true
max_visible = 5

icons_enabled = true
icon_size = 40

# Bodies longer than this are truncated; hover to preview the full text.
body_truncate_chars = 180

# History: recent notifications shown in the compact list.
history_recent_count = 6
history_max_entries = 100

# Textures: replace a flat color with an image. GIF/WEBP/APNG animate.
# background_image =
# bar_image =
# icon_source_dir =
# background_image_anchored = false

action_button_style = grouped    # grouped | boxed | minimal
action_button_position = inside  # inside | outside
bar_style = inside               # inside | edge
bar_position = below             # below | above

# Bar fill: false = drains remaining time, true = fills with elapsed time.
# Fill side: false = pinned to the right edge, true = pinned to the left.
bar_fill = false
bar_move_right = false

# Kit background transparency: 1.0 opaque, 0.0 transparent.
background_opacity = 1.0

[colors]
background = #1e1e2e
foreground = #cdd6f4
dim_foreground = #a6adc8

# Urgency accent colors (bar = timer bar, accent = card border).
[urgent_low]
bar = #6c7086
accent = #6c7086

[urgent_normal]
bar = #89b4fa
accent = #89b4fa

[urgent_warning]
bar = #f9e2af
accent = #f9e2af

[urgent_error]
bar = #f38ba8
accent = #f38ba8

[urgent_critical]
bar = #f38ba8
accent = #fb4934