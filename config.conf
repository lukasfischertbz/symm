# notifier configuration
# Window / layout
[general]
width = 360
margin = 20
radius = 12
font_family = Cantarell
font_size = 10.5
timeout_default = 10000
timeout_normal = 5000
timeout_critical = 15000
timer_default = 10000
top = 68

# Base colors
[colors]
background = #1e1e2e
foreground = #cdd6f4
dim_foreground = #a6adc8

# Urgency accent colors (bar = timer bar, accent = card border)
[urgent_low]
bar = #6c7086
accent = #6c7086

[urgent_normal]
bar = #89b4fa
accent = #89b4fa

[urgent_warning]
bar = #f9e2af
accent = #f9e2af

[urgent_error]
bar = #f38ba8
accent = #f38ba8

[urgent_critical]
bar = #f38ba8
accent = #fb4934
