# notifier configuration
# Window / layout
[general]
width = 360
margin = 20
radius = 0
# radius = 0  # rectangular cards (required for clean kitty-style blur)
# padding_h = horizontal space between card edge and text
padding_h = 16
# padding_v = vertical space between card edge and content (inside the card)
padding_v = 8
# card_spacing = vertical gap between stacked notifications
card_spacing = 18
font_family = Cantarell
font_size = 10.5
timeout_low = 10000
timeout_normal = 5000
timeout_critical = 15000
timer_default = 10000
top = 68
# background_opacity = 1.0  # kitty-style: 1.0 opaque, 0.0 transparent

# App-side blur (compositor-independent, on by default).
blur_enabled = true
blur_radius = 24

# Icons: rendered from the sending app's icon.
icons_enabled = true
icon_size = 40

# Details: bodies longer than this are truncated; hovering previews the full text.
body_truncate_chars = 180

# Use active monitor (Hyprland only): place each notification on the
# focused monitor at send time.
use_active_monitor = true

# History: how many recent notifications to show in the compact list.
history_recent_count = 6

# Textures: point these at an image instead of a flat color.
# Animated GIF/WEBP/APNG play automatically; AVIF if Qt has the plugin.
# background_image = /path/to/texture.gif
# bar_image = /path/to/bar-fill.png

# Random icon mode: pick a random image from this folder for every
# notification's icon, ignoring the sending app's icon.
# icon_source_dir = /path/to/symm/assets/icons

# When true, background_image is treated as one picture the size of the
# screen; each card shows its own slice.
# background_image_anchored = false

# Cap on notifications visible at once; extras queue (0 = unlimited).
max_visible = 5

# Action buttons: grouped | boxed | minimal
# Position: inside (within card) | outside (detached below card)
action_button_style = grouped
action_button_position = inside

# Timeout bar: inside (padded) | edge (flush with card border)
# Position: below (default) | above
bar_style = inside
bar_position = below

# Base colors
[colors]
background = #1e1e2e
foreground = #cdd6f4
dim_foreground = #a6adc8

# Urgency accent colors (bar = timer bar, accent = card border)
[urgent_low]
bar = #6c7086
accent = #6c7086

[urgent_normal]
bar = #89b4fa
accent = #89b4fa

[urgent_warning]
bar = #f9e2af
accent = #f9e2af

[urgent_error]
bar = #f38ba8
accent = #f38ba8

[urgent_critical]
bar = #f38ba8
accent = #fb4934
