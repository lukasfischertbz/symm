pre-commit:
  parallel: true
  commands:
    clang-format:
      glob: "*.{cpp,hpp}"
      run: clang-format --style=file -i {staged_files}
      stage_fixed: true

    cmake-format:
      glob: "*.cmake,CMakeLists.txt}"
      run: cmake-format -i {staged_files}
      stage_fixed: true

    prettier-check:
      glob: "*.md"
      run: prettier --write {staged_files}
      stage_fixed: true
